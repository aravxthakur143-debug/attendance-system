<!DOCTYPE html>
<html>

<head>

<title>Attendance History</title>

<style>

body{

font-family:Arial;
background:#f3f4f6;
padding:30px;

}

.box{

max-width:900px;
margin:auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 0 10px lightgray;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th,td{

padding:12px;

border:1px solid lightgray;

text-align:center;

}

th{

background:#2563eb;

color:white;

}

</style>

</head>

<body>


<div class="box">

<h1>Attendance History</h1>

<table>

<thead>

<tr>

<th>Name</th>
<th>Date</th>
<th>Hours</th>
<th>OT</th>

</tr>

</thead>


<tbody id="data">

</tbody>


</table>


</div>



<script>


let attendance = JSON.parse(

localStorage.getItem("attendance")

)||[];


let html="";


attendance.forEach(a=>{


html+=`

<tr>

<td>${a.name}</td>

<td>${a.date}</td>

<td>${a.hours}</td>

<td>${a.ot}</td>

</tr>

`;

});


document.getElementById("data").innerHTML=html;



</script>



</body>

</html>
