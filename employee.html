<!DOCTYPE html>
<html>

<head>

<title>Employees</title>

<style>

body{

font-family:Arial;
background:#f3f4f6;
padding:30px;

}

.box{

max-width:700px;
margin:auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 0 10px lightgray;

}

input{

width:100%;

padding:10px;

margin-top:10px;

box-sizing:border-box;

border:1px solid lightgray;

border-radius:5px;

}

button{

margin-top:15px;

padding:10px 20px;

background:#2563eb;

color:white;

border:none;

border-radius:5px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

#msg{

margin-top:15px;

color:green;

font-weight:bold;

}

.employee{

padding:10px;

margin-top:10px;

background:#f1f5f9;

border-radius:5px;

}

</style>

</head>

<body>


<div class="box">

<h1>Add Employee</h1>


<input
id="empname"
placeholder="Employee Name">


<input
id="salary"
placeholder="Monthly Salary">


<button onclick="addEmployee()">

Add Employee

</button>


<p id="msg"></p>


<hr>


<h2>Employee List</h2>


<div id="list"></div>



</div>



<script>


showEmployees();



function addEmployee(){


let name=document.getElementById("empname").value;

let salary=document.getElementById("salary").value;



if(name=="" || salary=="")
{

alert("Fill all fields");

return;

}



let employees = JSON.parse(

localStorage.getItem("employees")

)||[];




employees.push({

name:name,

salary:salary

});




localStorage.setItem(

"employees",

JSON.stringify(employees)

);




document.getElementById("msg").innerHTML=

"✅ Employee Added Successfully";



document.getElementById("empname").value="";

document.getElementById("salary").value="";



showEmployees();


}




function showEmployees(){


let employees = JSON.parse(

localStorage.getItem("employees")

)||[];



let html="";



employees.forEach(emp=>{


html+=`


<div class="employee">

<b>${emp.name}</b>

<br>

Salary : ₹${emp.salary}


</div>


`;



});



document.getElementById("list").innerHTML=html;


}



</script>



</body>

</html>
