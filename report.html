<!DOCTYPE html>
<html>

<head>

<title>Monthly Report</title>


<style>

body{

font-family:Arial;

background:#f3f4f6;

padding:30px;

}


.box{

max-width:900px;

margin:auto;


background:white;


padding:20px;


border-radius:10px;


box-shadow:0 0 10px lightgray;


}



table{


width:100%;

border-collapse:collapse;


margin-top:20px;


}


th,td{


padding:12px;


border:1px solid lightgray;


text-align:center;


}



th{


background:#2563eb;


color:white;


}


</style>


</head>


<body>



<div class="box">

<h1>Monthly Report</h1>



<table>


<thead>

<tr>

<th>Name</th>

<th>Present</th>

<th>OT</th>

<th>Salary</th>

</tr>

</thead>



<tbody id="report">


</tbody>



</table>



</div>



<script src="report.js"></script>


</body>

</html>
