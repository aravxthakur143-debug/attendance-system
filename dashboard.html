<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<style>

body{

margin:0;
font-family:Arial;
background:#f3f4f6;

}


.header{

background:#2563eb;

color:white;

padding:20px;

text-align:center;

}


.container{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:30px;

}


.card{


background:white;

padding:25px;

border-radius:10px;


box-shadow:0 0 10px rgba(0,0,0,.1);


text-align:center;


}


.num{


font-size:35px;

font-weight:bold;

margin-top:10px;

color:#2563eb;

}


button{


padding:10px 20px;


background:red;

color:white;


border:none;

border-radius:5px;

cursor:pointer;


}



</style>

</head>

<body>


<div class="header">

<h1>Attendance Dashboard</h1>

<h3>Welcome ARAV@2026</h3>

</div>



<div class="container">


<div class="card">

<h2>Total Employees</h2>

<div class="num">

0

</div>

</div>




<div class="card">

<h2>Present Today</h2>

<div class="num">

0

</div>

</div>



<div class="card">

<h2>Absent</h2>

<div class="num">

0

</div>

</div>




<div class="card">

<h2>Overtime</h2>

<div class="num">

0 Hrs

</div>

</div>




<div class="card">

<h2>Total Salary</h2>

<div class="num">

₹0

</div>

</div>



<div class="card">

<h2>Manual Attendance</h2>

<button onclick="window.location.href='manual.html'">

Open

</button>

</div>



</div>

</body>

</html>
<div class="card">

<h2>Add Employee</h2>

<button onclick="window.location.href='employee.html'">
Open
</button>

</div>
<div class="card">

<h2>Salary Calculator</h2>

<button onclick="window.location.href='salary.html'">
Open
</button>

</div>
